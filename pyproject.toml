[project]
name = "managebac-v2"
version = "2.3.1"
requires-python = ">=3.14,<3.15"
dependencies = ["starlette", "uvicorn", "httpx", "beautifulsoup4", "mcp>=1.27.2,<2", "pydantic>=2,<3"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "jsonschema"]

[tool.uv]
package = false
# Resolve to the versions the Approved test runtime already runs
# (Approved/Test Approved Launch/requirements.lock), so Working tests
# exercise the same libraries that a promotion would deploy.
constraint-dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "attrs==26.1.0",
    "beautifulsoup4==4.15.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "click==8.5.0",
    "cryptography==50.0.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "idna==3.19",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "mcp==1.27.2",
    "pycparser==3.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pydantic_core==2.46.5",
    "PyJWT==2.14.0",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "referencing==0.37.0",
    "rpds-py==2026.6.3",
    "soupsieve==2.9.2",
    "sse-starlette==3.4.11",
    "starlette==1.6.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "uvicorn==0.52.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

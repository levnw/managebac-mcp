<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timetable</title>
<style>
  :root { --bg:#FFFFFF; --bg-secondary:#F3F3F3; --text:#0D0D0D; --text-2:#5D5D5D; --text-3:#8F8F8F; --border:rgba(13,13,13,.09); --accent:#0285FF; }
  :root[data-theme="dark"] { --bg:#212121; --bg-secondary:#303030; --text:#FFFFFF; --text-2:#CDCDCD; --text-3:#AFAFAF; --border:rgba(255,255,255,.10); --accent:#0285FF; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#212121; --bg-secondary:#303030; --text:#FFFFFF; --text-2:#CDCDCD; --text-3:#AFAFAF; --border:rgba(255,255,255,.10); } }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45; }
  .card { background:var(--bg); border:1px solid var(--border); border-radius:18px; padding:16px; max-width:560px; margin:0 auto; }
  :root[data-display="fullscreen"] .card { width:min(100%, calc(100vw - 32px)); max-width:1100px; margin:16px auto calc(96px + env(safe-area-inset-bottom, 0px)); }
  .head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .title { font-size:16px; font-weight:600; line-height:1.3; }
  .subtitle { color:var(--text-2); font-size:13px; margin-top:2px; }
  .head-side { display:flex; align-items:flex-start; gap:8px; flex-shrink:0; }
  .count { color:var(--text-3); font-size:12px; white-space:nowrap; margin-top:2px; text-align:right; }
  .icon-btn { width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:999px; background:var(--bg); color:var(--text-2); cursor:pointer; }
  .icon-btn:hover { background:var(--bg-secondary); color:var(--text); }
  .icon-btn svg { width:14px; height:14px; stroke:currentColor; }
  :root[data-display="fullscreen"] #expand { display:none; }
  .divider { height:1px; background:var(--border); margin:14px -16px; }
  .section-label { font-size:11.5px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
  .meta { display:flex; flex-wrap:wrap; gap:5px; color:var(--text-2); font-size:12.5px; margin-top:2px; }
  .week-wrap { overflow-x:auto; margin:0 -4px; padding:0 4px 2px; }
  .week-board {
    display:grid;
    grid-template-columns:repeat(var(--day-count, 5), minmax(124px, 1fr));
    gap:0;
    min-width:0;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
  }
  :root:not([data-display="fullscreen"]) .week-board {
    display:block;
    border-top:none;
    border-bottom:none;
  }
  :root:not([data-display="fullscreen"]) .week-wrap {
    overflow:visible;
    margin:0;
    padding:0;
  }
  :root:not([data-display="fullscreen"]) .day-col {
    border-right:none;
    overflow:visible;
  }
  :root:not([data-display="fullscreen"]) .day-col + .day-col {
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid var(--border);
  }
  :root:not([data-display="fullscreen"]) .day-head {
    padding:0 0 8px;
  }
  :root:not([data-display="fullscreen"]) .day-body {
    border-top:1px solid var(--border);
  }
  :root:not([data-display="fullscreen"]) .lesson {
    display:grid;
    grid-template-columns:82px minmax(0, 1fr);
    column-gap:12px;
    min-height:0;
    padding:10px 0;
  }
  :root:not([data-display="fullscreen"]) .lesson-time {
    margin:1px 0 0;
  }
  :root:not([data-display="fullscreen"]) .lesson-title,
  :root:not([data-display="fullscreen"]) .lesson-meta,
  :root:not([data-display="fullscreen"]) .lesson-task {
    grid-column:2;
  }
  .day-col {
    min-width:0;
    overflow:hidden;
    background:var(--bg);
    border-right:1px solid var(--border);
  }
  .day-col:last-child { border-right:none; }
  .day-head {
    padding:9px 10px 7px;
    border-bottom:1px solid var(--border);
    background:transparent;
  }
  .day-name {
    color:var(--text);
    font-size:13px;
    font-weight:600;
    line-height:1.2;
  }
  .day-date {
    display:block;
    color:var(--text-3);
    font-size:11px;
    font-weight:500;
    margin-top:2px;
  }
  .day-body {
    display:flex;
    flex-direction:column;
  }
  .lesson {
    min-height:58px;
    padding:9px 10px;
    border-bottom:1px solid var(--border);
    border-radius:0;
  }
  .lesson:last-child { border-bottom:none; }
  .lesson.current {
    background:transparent;
  }
  .lesson-time {
    color:var(--text-3);
    font-size:11px;
    line-height:1.2;
    margin-bottom:3px;
  }
  .lesson-title {
    color:var(--text);
    font-size:12.5px;
    font-weight:600;
    line-height:1.24;
    overflow-wrap:break-word;
  }
  .lesson.current .lesson-title {
    color:var(--text);
  }
  .lesson-meta {
    color:var(--text-2);
    font-size:11px;
    line-height:1.2;
    margin-top:3px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .actions { display:flex; gap:8px; margin-top:16px; }
  .btn { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:inherit; font-size:13.5px; font-weight:600; padding:9px 14px; border-radius:12px; border:1px solid var(--border); background:var(--bg); color:var(--text); text-decoration:none; }
  .btn:hover { background:var(--bg-secondary); }
  .btn svg { width:14px; height:14px; stroke:currentColor; }
  .empty, .empty-state { color:var(--text-3); font-size:13px; padding:16px 0 2px; }
  .empty-title { color:var(--text-2); font-weight:600; font-size:13.5px; }
  .empty-copy { margin-top:2px; color:var(--text-3); }
</style>
</head>
<body>
<div class="card" id="card"><div class="empty">Loading timetable...</div></div>
<script>
"use strict";
const card = document.getElementById("card");
const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';
const EXPAND_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function applyHostContext() {
  const t = window.openai?.theme;
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  document.documentElement.dataset.display = window.openai?.displayMode || "inline";
}
let heightFrame = 0;
let lastReportedHeight = 0;
function reportHeight() {
  if (heightFrame) return;
  heightFrame = requestAnimationFrame(() => {
    heightFrame = 0;
    const h = Math.ceil(document.body.scrollHeight);
    if (Math.abs(h - lastReportedHeight) < 2) return;
    lastReportedHeight = h;
    try { window.openai?.notifyIntrinsicHeight?.(h); } catch (_) {}
  });
}
new ResizeObserver(reportHeight).observe(document.body);
function requestFullscreen() {
  try { window.openai?.requestDisplayMode?.({ mode: "fullscreen" }); } catch (_) {}
}
function emptyState(title, copy) {
  return `<div class="empty-state"><div class="empty-title">${esc(title)}</div>${copy ? `<div class="empty-copy">${esc(copy)}</div>` : ""}</div>`;
}

function normalSlot(s) {
  return {
    id: s.id ?? s.class_id ?? "",
    period: s.period ?? s.p ?? "",
    day: s.day ?? s.d ?? "",
    time: s.time_start ?? s.t ?? "",
    time_end: s.time_end ?? "",
    class_name: s.class_name ?? s.c ?? "",
    teacher: s.teacher ?? s.tr ?? "",
    room: s.room ?? s.r ?? "",
    task_count: s.task_count ?? s.n ?? 0,
    current: !!s.current,
  };
}
function slotKey(s, i) {
  return [s.id, s.day, s.period, s.time, s.class_name, i].filter((v) => v !== "").join(":");
}

function dayLabel(day) {
  const parts = String(day || "").split(",").map((p) => p.trim()).filter(Boolean);
  return parts.length > 1 ? `${parts[1]}, ${parts[0]}` : String(day || "");
}
function compactDayLabel(day) {
  const parts = String(day || "").split(",").map((p) => p.trim()).filter(Boolean);
  return {
    label: parts.length > 1 ? parts[1] : (parts[0] || "Day"),
    date: parts.length > 1 ? parts[0] : "",
  };
}
function slotSort(a, b) {
  const pa = Number(String(a.period).match(/\d+/)?.[0]);
  const pb = Number(String(b.period).match(/\d+/)?.[0]);
  if (Number.isFinite(pa) && Number.isFinite(pb) && pa !== pb) return pa - pb;
  return String(a.time || a.period).localeCompare(String(b.time || b.period));
}

function slotRow(s, currentDay) {
  const meta = [];
  if (s.teacher) meta.push(esc(s.teacher));
  if (s.room) meta.push(esc(s.room));
  const isCurrent = s.current || (currentDay && s.day === currentDay);
  const time = [s.time, s.time_end].filter(Boolean).join(" - ");
  return `<div class="slot${isCurrent ? " current" : ""}">
    <div class="time">${esc(time || s.period || "")}</div>
    <div class="main">
      <div class="class">${esc(s.class_name || "Class")}</div>
      ${meta.length ? `<div class="meta">${meta.join(" · ")}</div>` : ""}
      ${s.task_count ? `<div class="tasks">${esc(s.task_count)} ManageBac ${s.task_count === 1 ? "task" : "tasks"} linked to this class</div>` : ""}
    </div>
  </div>`;
}

function weekGrid(slots, currentDay, options = {}) {
  const hideSingleDayHeader = !!options.hideSingleDayHeader;
  const explicitDays = Array.isArray(options.days) ? options.days : [];
  const dayOrder = explicitDays.map((d) => d.label || d).filter(Boolean);
  const days = new Set();
  const byDay = new Map();
  for (const day of dayOrder) {
    days.add(day);
    byDay.set(day, []);
  }
  for (const s of slots) {
    const day = s.day || "Today";
    if (!days.has(day)) {
      days.add(day);
      dayOrder.push(day);
      byDay.set(day, []);
    }
    byDay.get(day).push(s);
  }
  let h = `<div class="week-wrap"><div class="week-board" style="--day-count:${Math.max(1, dayOrder.length)}">`;
  for (const day of dayOrder) {
    const d = compactDayLabel(day);
    const today = currentDay && day === currentDay ? " today" : "";
    const showHeader = !(hideSingleDayHeader && dayOrder.length === 1);
    const rows = (byDay.get(day) || []).sort(slotSort);
    h += `<div class="day-col${today}">
      ${showHeader ? `<div class="day-head"><div class="day-name">${esc(d.label)}</div>${d.date ? `<span class="day-date">${esc(d.date)}</span>` : ""}</div>` : ""}
      <div class="day-body">`;
    if (!rows.length) {
      h += `<div class="empty" style="padding:10px 0;color:var(--text-3);font-size:12.5px">No classes</div>`;
    }
    for (const s of rows) {
      const meta = [s.teacher, s.room].filter(Boolean).join(" · ");
      const time = [s.time, s.time_end].filter(Boolean).join(" - ");
      const isCurrent = s.current || (currentDay && s.day === currentDay);
      h += `<div class="lesson${isCurrent ? " current" : ""}">
        ${time ? `<div class="lesson-time">${esc(time)}</div>` : ""}
        <div class="lesson-title">${esc(s.class_name || "Class")}</div>
        ${meta ? `<div class="lesson-meta">${esc(meta)}</div>` : ""}
      </div>`;
    }
    h += `</div></div>`;
  }
  h += `</div></div>`;
  return h;
}

function renderTimetable(data) {
  const slots = (data.timetable || []).map(normalSlot).filter((s) => s.class_name || s.time).map((s, i) => ({ ...s, key: slotKey(s, i) }));
  const current = data.current || {};
  const currentDay = current.day || current.raw_day || "";
  const explicitDays = (data.days || []).map((d) => d.label || d).filter(Boolean);
  const uniqueDays = explicitDays.length ? explicitDays : [...new Set(slots.map((s) => s.day || "Today"))];
  const headerSubtitle = [current.weekday, current.date].filter(Boolean).join(", ");
  const canExpand = uniqueDays.length > 1;
  let h = `<div class="head"><div><div class="title">Timetable</div>${headerSubtitle ? `<div class="subtitle">${esc(headerSubtitle)}</div>` : ""}</div><div class="head-side"><div class="count">${slots.length} ${slots.length === 1 ? "class" : "classes"}</div>${canExpand ? `<button class="icon-btn" id="expand" type="button" aria-label="Open fullscreen">${EXPAND_ICON}</button>` : ""}</div></div>`;
  h += `<div class="divider"></div>`;
  if (!slots.length && !uniqueDays.length) {
    h += emptyState("No classes scheduled", "There is no timetable data for this view.");
  } else {
    h += weekGrid(slots, currentDay, { hideSingleDayHeader: uniqueDays.length === 1, days: data.days || [] });
  }
  if (data.url) h += `<div class="actions"><a class="btn" href="${esc(data.url)}" target="_blank" rel="noopener">${LINK_ICON} Open in ManageBac</a></div>`;
  card.innerHTML = h;
  card.querySelector("#expand")?.addEventListener("click", requestFullscreen);
  reportHeight();
}

applyHostContext();
const live = window.openai?.toolOutput;
if (live && Array.isArray(live.timetable)) renderTimetable(live);
window.addEventListener("message", (ev) => {
  if (ev.source !== window.parent) return;
  const d = ev.data?.params?.structuredContent;
  if (d && Array.isArray(d.timetable)) renderTimetable(d);
}, { passive:true });
window.addEventListener("openai:set_globals", (ev) => {
  applyHostContext();
  const d = ev.detail?.globals?.toolOutput ?? window.openai?.toolOutput;
  if (d && Array.isArray(d.timetable)) renderTimetable(d);
}, { passive:true });
// Safety net: ChatGPT draws the widget frame from the tool template even when
// the call errors or the payload is dropped — never spin forever. If nothing
// has rendered after 8s, show a quiet empty state instead of the loader.
setTimeout(() => {
  if (!card.querySelector(".head")) {
    card.innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:14px 0;text-align:center">Nothing to show right now \u2014 ask ChatGPT to try again.</div>';
    reportHeight();
  }
}, 8000);
</script>
</body>
</html>

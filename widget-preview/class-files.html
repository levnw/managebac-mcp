<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Files</title>
<style>
  :root { --bg:#FFFFFF; --bg-secondary:#F3F3F3; --text:#0D0D0D; --text-2:#5D5D5D; --text-3:#8F8F8F; --border:rgba(13,13,13,.09); --accent:#0285FF; }
  :root[data-theme="dark"] { --bg:#212121; --bg-secondary:#303030; --text:#FFFFFF; --text-2:#CDCDCD; --text-3:#AFAFAF; --border:rgba(255,255,255,.10); --accent:#0285FF; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#212121; --bg-secondary:#303030; --text:#FFFFFF; --text-2:#CDCDCD; --text-3:#AFAFAF; --border:rgba(255,255,255,.10); } }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45; }
  .card { background:var(--bg); border:1px solid var(--border); border-radius:18px; padding:16px; max-width:560px; margin:0 auto; }
  :root[data-display="fullscreen"] .card { width:min(100%, calc(100vw - 32px)); max-width:960px; margin:16px auto calc(96px + env(safe-area-inset-bottom, 0px)); }
  .head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .title { font-size:16px; font-weight:600; line-height:1.3; }
  .subtitle { color:var(--text-2); font-size:13px; margin-top:2px; }
  .head-side { display:flex; align-items:flex-start; gap:8px; flex-shrink:0; }
  .count { color:var(--text-3); font-size:12px; white-space:nowrap; margin-top:2px; text-align:right; }
  .icon-btn { width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:999px; background:var(--bg); color:var(--text-2); cursor:pointer; }
  .icon-btn:hover { background:var(--bg-secondary); color:var(--text); }
  .icon-btn svg { width:14px; height:14px; stroke:currentColor; }
  :root[data-display="fullscreen"] #expand { display:none; }
  .divider { height:1px; background:var(--border); margin:14px -16px; }
  .search { width:100%; border:1px solid var(--border); background:var(--bg-secondary); color:var(--text); border-radius:12px; padding:9px 11px; font:inherit; font-size:13px; outline:none; margin-bottom:8px; }
  .section-label { font-size:11.5px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; margin:12px 0 2px; }
  .section-label:first-of-type { margin-top:0; }
  .file {
    width:100%; display:flex; align-items:center; gap:10px; color:inherit; text-decoration:none;
    padding:9px 8px; border:0; border-bottom:1px solid var(--border); border-radius:10px; background:transparent;
    font:inherit; text-align:left; cursor:pointer;
  }
  .file:last-child { border-bottom:none; }
  .file:hover .name, .file:focus-visible .name { color:var(--accent); }
  .file:focus-visible { outline:none; background:rgba(2,133,255,.06); }
  .file.selected {
    background:color-mix(in srgb, var(--accent) 8%, var(--bg)); border-bottom-color:transparent;
  }
  .file.selected + .file.selected { border-top-left-radius:0; border-top-right-radius:0; }
  .file.selected:has(+ .file.selected) { border-bottom-left-radius:0; border-bottom-right-radius:0; }
  .file.selected .name { color:var(--accent); }
  .icon { width:18px; height:18px; color:var(--text-3); flex-shrink:0; }
  .main { display:block; flex:1 1 auto; min-width:0; overflow:hidden; }
  .name { display:block; max-width:100%; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:color .12s ease; }
  .meta { display:flex; flex-wrap:wrap; gap:5px; color:var(--text-2); font-size:12px; margin-top:1px; }
  .sep { color:var(--text-3); margin:0 2px; }
  .file-open {
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:8px; border:none; background:transparent;
    color:var(--text-3); cursor:pointer; flex-shrink:0;
  }
  .file-open:hover { color:var(--text); background:var(--bg-secondary); }
  .file-open svg { width:14px; height:14px; stroke:currentColor; }
  .selection-bar {
    display:none; align-items:center; justify-content:space-between; gap:10px;
    margin-top:12px; padding:9px 10px; border:1px solid var(--border);
    border-radius:12px; background:var(--bg-secondary);
  }
  .selection-bar.active { display:flex; }
  .selection-count { font-size:12.5px; color:var(--text-2); }
  .selection-actions { display:flex; align-items:center; gap:8px; }
  .mini-btn {
    font-family:inherit; font-size:12.5px; font-weight:600;
    border:none; background:transparent; color:var(--text-2); cursor:pointer; padding:4px 0;
  }
  .mini-btn:hover { color:var(--text); }
  .mini-btn.primary { color:var(--accent); }
  .actions { display:flex; gap:8px; margin-top:16px; }
  .btn { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:inherit; font-size:13.5px; font-weight:600; padding:9px 14px; border-radius:12px; border:1px solid var(--accent); background:var(--accent); color:#fff; text-decoration:none; }
  .btn svg { width:14px; height:14px; stroke:currentColor; }
  .empty, .empty-state { color:var(--text-3); font-size:13px; padding:16px 0 2px; }
  .empty-title { color:var(--text-2); font-weight:600; font-size:13.5px; }
  .empty-copy { margin-top:2px; color:var(--text-3); }
  @media (max-width:419px) {
    .file { gap:7px; padding-left:6px; padding-right:6px; }
    .icon { width:16px; height:16px; }
    .file-open { width:24px; height:24px; }
  }
</style>
</head>
<body>
<div class="card" id="card"><div class="empty">Loading files...</div></div>
<script>
"use strict";
const card = document.getElementById("card");
const FILE_ICON = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';
const EXPAND_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
let currentData = null;
let selectedFiles = new Set();

function applyHostContext() {
  const t = window.openai?.theme;
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  document.documentElement.dataset.display = window.openai?.displayMode || "inline";
}
let heightFrame = 0;
let lastReportedHeight = 0;
function reportHeight() {
  if (heightFrame) return;
  heightFrame = requestAnimationFrame(() => {
    heightFrame = 0;
    const h = Math.ceil(document.body.scrollHeight);
    if (Math.abs(h - lastReportedHeight) < 2) return;
    lastReportedHeight = h;
    try { window.openai?.notifyIntrinsicHeight?.(h); } catch (_) {}
  });
}
new ResizeObserver(reportHeight).observe(document.body);
function requestFullscreen() {
  try { window.openai?.requestDisplayMode?.({ mode: "fullscreen" }); } catch (_) {}
}
function emptyState(title, copy) {
  return `<div class="empty-state"><div class="empty-title">${esc(title)}</div>${copy ? `<div class="empty-copy">${esc(copy)}</div>` : ""}</div>`;
}

function fileKey(file, i) {
  return String(file.id || `${file.folder || "files"}:${file.name || "file"}:${file.url || ""}:${i}`);
}
function fileRow(file) {
  const meta = [];
  if (file.size) meta.push(esc(file.size));
  if (file.uploaded_at) meta.push(esc(file.uploaded_at));
  if (file.uploaded_by) meta.push(`by ${esc(file.uploaded_by)}`);
  const search = [file.name, file.folder, file.uploaded_by].filter(Boolean).join(" ").toLowerCase();
  const selected = selectedFiles.has(file.key);
  return `<button class="file${selected ? " selected" : ""}" type="button" data-file-key="${esc(file.key)}" data-search="${esc(search)}" aria-pressed="${selected ? "true" : "false"}">
    ${FILE_ICON}
    <span class="main">
      <span class="name">${esc(file.name || "File")}</span>
      ${meta.length ? `<span class="meta">${meta.join('<span class="sep">|</span>')}</span>` : ""}
    </span>
    ${file.url ? `<span class="file-open" data-open-url="${esc(file.url)}" title="Open file">${LINK_ICON}</span>` : ""}
  </button>`;
}

function renderFiles(data, query = "") {
  currentData = data;
  const q = query.trim().toLowerCase();
  const files = (data.files || []).filter((f) => f && f.name).map((f, i) => ({ ...f, key: fileKey(f, i) }));
  selectedFiles = new Set([...selectedFiles].filter((key) => files.some((f) => f.key === key)));
  const visible = q ? files.filter((f) => [f.name, f.folder, f.uploaded_by].filter(Boolean).join(" ").toLowerCase().includes(q)) : files;
  const groups = new Map();
  for (const f of visible) {
    const key = f.folder || "Class files";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(f);
  }
  let h = `<div class="head"><div><div class="title">Files</div>${data.class_name ? `<div class="subtitle">${esc(data.class_name)}</div>` : ""}</div><div class="head-side"><div class="count">${files.length} ${files.length === 1 ? "file" : "files"}</div><button class="icon-btn" id="expand" type="button" aria-label="Open fullscreen">${EXPAND_ICON}</button></div></div>`;
  h += `<div class="divider"></div>`;
  h += `<input class="search" id="file-search" placeholder="Search files" value="${esc(query)}">`;
  if (!visible.length) {
    h += files.length
      ? emptyState("No matching files", "Try a different file name, folder, or teacher.")
      : emptyState("No files uploaded", "This class does not have resource files yet.");
  } else {
    for (const [folder, items] of groups) {
      h += `<div class="section-label">${esc(folder)}</div>`;
      h += items.map(fileRow).join("");
    }
    h += `<div class="selection-bar" id="selection-bar">
            <div class="selection-count" id="selection-count">No files selected</div>
            <div class="selection-actions">
              <button class="mini-btn" id="clear-files" type="button">Clear</button>
              <button class="mini-btn primary" id="ask-files" type="button">Ask ChatGPT</button>
            </div>
          </div>`;
  }
  if (data.url) h += `<div class="actions"><a class="btn" href="${esc(data.url)}" target="_blank" rel="noopener">${LINK_ICON} Open in ManageBac</a></div>`;
  card.innerHTML = h;
  const input = document.getElementById("file-search");
  input?.addEventListener("input", () => renderFiles(currentData, input.value));
  card.querySelector("#expand")?.addEventListener("click", requestFullscreen);
  function selectedFileObjects() {
    return files.filter((f) => selectedFiles.has(f.key));
  }
  function saveSelection() {
    const selected = selectedFileObjects().map((f) => ({
      name: f.name,
      url: f.url,
      folder: f.folder,
      size: f.size,
      uploaded_at: f.uploaded_at,
      uploaded_by: f.uploaded_by,
    }));
    try { window.openai?.setWidgetState?.({ selected_class_files: selected }); } catch (_) {}
  }
  function updateSelectionBar(persist = true) {
    const bar = document.getElementById("selection-bar");
    const count = document.getElementById("selection-count");
    if (!bar || !count) return;
    const n = selectedFiles.size;
    bar.classList.toggle("active", n > 0);
    count.textContent = n === 1 ? "1 file selected" : `${n} files selected`;
    card.querySelectorAll("[data-file-key]").forEach((row) => {
      const active = selectedFiles.has(row.dataset.fileKey);
      row.classList.toggle("selected", active);
      row.setAttribute("aria-pressed", active ? "true" : "false");
    });
    if (persist) saveSelection();
    reportHeight();
  }
  card.querySelectorAll("[data-file-key]").forEach((row) => {
    row.addEventListener("click", (ev) => {
      const openTarget = ev.target.closest("[data-open-url]");
      if (openTarget) {
        ev.stopPropagation();
        const href = openTarget.dataset.openUrl;
        if (window.openai?.openExternal) window.openai.openExternal({ href });
        else window.open(href, "_blank", "noopener");
        return;
      }
      const key = row.dataset.fileKey;
      if (selectedFiles.has(key)) selectedFiles.delete(key);
      else selectedFiles.add(key);
      updateSelectionBar(true);
    });
  });
  document.getElementById("clear-files")?.addEventListener("click", () => {
    selectedFiles.clear();
    updateSelectionBar(true);
  });
  document.getElementById("ask-files")?.addEventListener("click", () => {
    const selected = selectedFileObjects();
    if (!selected.length) return;
    const list = selected.map((f, i) => {
      const meta = [f.folder, f.size, f.uploaded_by && `by ${f.uploaded_by}`].filter(Boolean).join(", ");
      return `${i + 1}. ${f.name}${meta ? ` (${meta})` : ""}`;
    }).join("\n");
    const prompt = `Use these selected ManageBac class files to help me answer my question or prepare for class.\n\nClass: ${data.class_name || "Unknown class"}\nSelected files:\n${list}`;
    try { window.openai?.sendFollowUpMessage?.({ prompt }); } catch (_) {}
  });
  updateSelectionBar(false);
  reportHeight();
}

applyHostContext();
const live = window.openai?.toolOutput;
if (live && Array.isArray(live.files)) renderFiles(live);
window.addEventListener("message", (ev) => {
  if (ev.source !== window.parent) return;
  const d = ev.data?.params?.structuredContent;
  if (d && Array.isArray(d.files)) renderFiles(d);
}, { passive:true });
window.addEventListener("openai:set_globals", (ev) => {
  applyHostContext();
  const d = ev.detail?.globals?.toolOutput ?? window.openai?.toolOutput;
  if (d && Array.isArray(d.files)) renderFiles(d);
}, { passive:true });
// Safety net: ChatGPT draws the widget frame from the tool template even when
// the call errors or the payload is dropped — never spin forever. If nothing
// has rendered after 8s, show a quiet empty state instead of the loader.
setTimeout(() => {
  if (!card.querySelector(".head")) {
    card.innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:14px 0;text-align:center">Nothing to show right now \u2014 ask ChatGPT to try again.</div>';
    reportHeight();
  }
}, 8000);
</script>
</body>
</html>

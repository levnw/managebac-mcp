<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasks</title>
<style>
  :root {
    --bg:            #FFFFFF;
    --bg-secondary:  #F3F3F3;
    --text:          #0D0D0D;
    --text-2:        #5D5D5D;
    --text-3:        #8F8F8F;
    --border:        rgba(13,13,13,.09);
    --accent:        #0285FF;
    --red:           #E02E2A;
  }
  :root[data-theme="dark"] {
    --bg:            #212121;
    --bg-secondary:  #303030;
    --text:          #FFFFFF;
    --text-2:        #CDCDCD;
    --text-3:        #AFAFAF;
    --border:        rgba(255,255,255,.10);
    --accent:        #0285FF;
    --red:           #FF8583;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:            #212121;
      --bg-secondary:  #303030;
      --text:          #FFFFFF;
      --text-2:        #CDCDCD;
      --text-3:        #AFAFAF;
      --border:        rgba(255,255,255,.10);
      --red:           #FF8583;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.45;
  }

  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    max-width: 560px;
    margin: 0 auto;
  }
  :root[data-display="fullscreen"] .card {
    max-width: 720px;
    margin: 16px auto calc(96px + env(safe-area-inset-bottom, 0px));
  }
  .head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .title { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .subtitle { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .head-side { display: flex; align-items: flex-start; gap: 8px; flex-shrink: 0; }
  .count { font-size: 12px; color: var(--text-3); white-space: nowrap; margin-top: 2px; text-align: right; }
  .icon-btn {
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg);
    color: var(--text-2);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--bg-secondary); color: var(--text); }
  .icon-btn svg { width: 14px; height: 14px; stroke: currentColor; }

  .divider { height: 1px; background: var(--border); margin: 14px -16px; }
  .group + .group { margin-top: 14px; }
  .group-label {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: .04em;
    margin-bottom: 2px;
  }

  .rows { display: flex; flex-direction: column; }
  .row {
    display: block;
    color: inherit;
    text-decoration: none;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row:hover .row-title { color: var(--accent); }

  .row-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .row-main { min-width: 0; flex: 1; }
  .row-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    overflow-wrap: break-word;
    transition: color .12s ease;
  }
  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
    color: var(--text-2);
    font-size: 12.5px;
    margin-top: 2px;
  }
  .sep { color: var(--text-3); margin: 0 2px; }
  .due {
    flex-shrink: 0;
    text-align: right;
    min-width: 58px;
  }
  .due-date { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .due-date.overdue { color: var(--red); }
  .due-time { font-size: 11.5px; color: var(--text-3); white-space: nowrap; margin-top: 1px; }

  .grades {
    color: var(--text-2);
    font-size: 12.5px;
    margin-top: 6px;
  }
  .grades b { color: var(--text); font-weight: 600; }
  .hint {
    color: var(--text-3);
    font-size: 12px;
    margin-top: 5px;
  }
  .more-btn {
    display: inline-block;
    margin-top: 6px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--accent);
    background: none;
    border: none;
    padding: 2px 0;
    cursor: pointer;
  }
  .more-btn:hover { text-decoration: underline; }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 14px;
    border-radius: 12px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    text-decoration: none;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn svg { width: 14px; height: 14px; stroke: currentColor; }
  .empty, .empty-state { color: var(--text-3); font-size: 13px; padding: 16px 0 2px; }
  .empty-title { color: var(--text-2); font-weight: 600; font-size: 13.5px; }
  .empty-copy { margin-top: 2px; color: var(--text-3); }

  @media (max-width: 419px) {
    .head, .row-top { gap: 10px; }
    .due { min-width: 50px; }
    .row-title { font-size: 13.5px; }
    .meta, .grades { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="empty">Loading tasks...</div>
</div>

<script>
"use strict";

const card = document.getElementById("card");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';
const EXPAND_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';

let groupState = {};

function applyHostContext() {
  const t = window.openai?.theme;
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  document.documentElement.dataset.display = window.openai?.displayMode || "inline";
}
let heightFrame = 0;
let lastReportedHeight = 0;
function reportHeight() {
  if (heightFrame) return;
  heightFrame = requestAnimationFrame(() => {
    heightFrame = 0;
    const h = Math.ceil(document.body.scrollHeight);
    if (Math.abs(h - lastReportedHeight) < 2) return;
    lastReportedHeight = h;
    try { window.openai?.notifyIntrinsicHeight?.(h); } catch (_) {}
  });
}
new ResizeObserver(reportHeight).observe(document.body);
function requestFullscreen() {
  try { window.openai?.requestDisplayMode?.({ mode: "fullscreen" }); } catch (_) {}
}
function emptyState(title, copy) {
  return `<div class="empty-state"><div class="empty-title">${esc(title)}</div>${copy ? `<div class="empty-copy">${esc(copy)}</div>` : ""}</div>`;
}

function dateParts(task) {
  const combined = task.date || [task.due_month, task.due_day].filter(Boolean).join(" ");
  const m = /^([A-Za-z]{3,})\s+(\d{1,2})$/.exec((combined || "").trim());
  return { month: m ? m[1].slice(0, 3) : "", day: m ? m[2] : "" };
}

function labels(task) {
  const items = [];
  if (task.type) items.push(task.type);
  for (const tag of task.tags || []) items.push(tag);
  for (const label of task.labels || []) if (label?.text) items.push(label.text);
  return [...new Set(items)].slice(0, 2).join(" · ");
}

function statusText(task) {
  const s = task.status || "";
  if (!s || s.toLowerCase() === "n/a") return "";
  if (task.due_past && ["pending", "not submitted", "incomplete"].includes(s.toLowerCase())) return "Overdue";
  return s;
}

function gradeText(task) {
  const grades = task.grades;
  if (!grades) return "";
  if (Array.isArray(grades)) {
    return grades.map((g) => `${esc(g.label)} <b>${esc(g.score)}</b>/${esc(g.max)}`).join(" · ");
  }
  return ["A", "B", "C", "D"].map((k) => {
    const g = grades[k];
    if (!g) return "";
    const score = g.score ?? g.latest ?? "N/A";
    const max = g.max ?? g.out_of ?? "";
    return `${esc(k)} <b>${esc(score)}</b>${max ? "/" + esc(max) : ""}`;
  }).filter(Boolean).join(" · ");
}

function isUpcoming(task) {
  if (typeof task.due_past === "boolean") return !task.due_past;
  return (task.group || task.bucket || "").toLowerCase() !== "completed";
}

function row(task) {
  const d = dateParts(task);
  const meta = [];
  if (task.class_name) meta.push(esc(task.class_name));
  const label = labels(task);
  if (label) meta.push(esc(label));
  const status = statusText(task);
  if (status) meta.push(esc(status));
  const grades = gradeText(task);
  const url = task.url || "#";
  const commentHint = task.teacher_comment ? `<div class="hint">Teacher feedback available</div>` : "";

  return `<a class="row" href="${esc(url)}" target="_blank" rel="noopener">
    <div class="row-top">
      <div class="row-main">
        <div class="row-title">${esc(task.title || "Task")}</div>
        ${meta.length ? `<div class="meta">${meta.join('<span class="sep">|</span>')}</div>` : ""}
        ${grades ? `<div class="grades">Grades ${grades}</div>` : ""}
        ${commentHint}
      </div>
      <div class="due">
        ${d.month && d.day ? `<div class="due-date${task.due_past ? " overdue" : ""}">${esc(d.month)} ${esc(d.day)}</div>` : ""}
        ${task.due_day_time || task.due_time ? `<div class="due-time">${esc(task.due_day_time || task.due_time)}</div>` : ""}
      </div>
    </div>
  </a>`;
}

function group(title, tasks, key) {
  if (!tasks.length) return "";
  const expanded = !!groupState[key];
  const visible = expanded ? tasks : tasks.slice(0, 4);
  const hidden = tasks.length - visible.length;
  return `<div class="group" data-group="${esc(key)}">
    <div class="group-label">${esc(title)}</div>
    <div class="rows">${visible.map(row).join("")}</div>
    ${hidden > 0 ? `<button class="more-btn" data-toggle="${esc(key)}">+ ${hidden} more</button>` : ""}
    ${expanded && tasks.length > 4 ? `<button class="more-btn" data-toggle="${esc(key)}">Show less</button>` : ""}
  </div>`;
}

function renderTaskList(data) {
  const tasks = (data.tasks || []).filter((t) => t && t.title);
  const upcoming = tasks.filter(isUpcoming);
  const completed = tasks.filter((t) => !isUpcoming(t));

  let h = `<div class="head">
    <div>
      <div class="title">${esc(data.title || "Tasks")}</div>
      ${data.class_name ? `<div class="subtitle">${esc(data.class_name)}</div>` : ""}
    </div>
    <div class="head-side">
      <div class="count">${tasks.length} ${tasks.length === 1 ? "task" : "tasks"}</div>
      <button class="icon-btn" id="expand" type="button" aria-label="Open fullscreen">${EXPAND_ICON}</button>
    </div>
  </div>`;

  if (!tasks.length) {
    h += `<div class="divider"></div>${emptyState("No tasks found", "There are no tasks in this view right now.")}`;
  } else {
    h += `<div class="divider"></div>`;
    h += group("Upcoming", upcoming, "upcoming");
    h += group("Completed", completed, "completed");
  }

  if (data.url) {
    h += `<div class="actions"><a class="btn primary" href="${esc(data.url)}" target="_blank" rel="noopener">${LINK_ICON} Open in ManageBac</a></div>`;
  }

  card.innerHTML = h;
  card.querySelectorAll("[data-toggle]").forEach((btn) => {
    btn.addEventListener("click", (ev) => {
      ev.preventDefault();
      const key = btn.getAttribute("data-toggle");
      groupState[key] = !groupState[key];
      try { window.openai?.setWidgetState?.({ groups: { ...groupState } }); } catch (_) {}
      renderTaskList(data);
    });
  });
  card.querySelector("#expand")?.addEventListener("click", requestFullscreen);
  reportHeight();
}

applyHostContext();
try {
  const saved = window.openai?.widgetState?.groups;
  if (saved && typeof saved === "object") groupState = { ...groupState, ...saved };
} catch (_) {}

const live = window.openai?.toolOutput;
if (live && live.tasks) renderTaskList(live);

window.addEventListener("message", (ev) => {
  if (ev.source !== window.parent) return;
  const d = ev.data?.params?.structuredContent;
  if (d && d.tasks) renderTaskList(d);
}, { passive: true });

window.addEventListener("openai:set_globals", (ev) => {
  applyHostContext();
  const d = ev.detail?.globals?.toolOutput ?? window.openai?.toolOutput;
  if (d && d.tasks) renderTaskList(d);
}, { passive: true });

window.renderTaskList = renderTaskList;
// Safety net: ChatGPT draws the widget frame from the tool template even when
// the call errors or the payload is dropped — never spin forever. If nothing
// has rendered after 8s, show a quiet empty state instead of the loader.
setTimeout(() => {
  if (!card.querySelector(".head")) {
    card.innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:14px 0;text-align:center">Nothing to show right now \u2014 ask ChatGPT to try again.</div>';
    reportHeight();
  }
}, 8000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classes</title>
<style>
  :root { --bg:#FFFFFF; --bg-secondary:#F3F3F3; --text:#0D0D0D; --text-2:#5D5D5D; --text-3:#8F8F8F; --border:rgba(13,13,13,.09); --accent:#0285FF; }
  :root[data-theme="dark"] { --bg:#212121; --bg-secondary:#303030; --text:#FFFFFF; --text-2:#CDCDCD; --text-3:#AFAFAF; --border:rgba(255,255,255,.10); --accent:#0285FF; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#212121; --bg-secondary:#303030; --text:#FFFFFF; --text-2:#CDCDCD; --text-3:#AFAFAF; --border:rgba(255,255,255,.10); } }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45; }
  .card { background:var(--bg); border:1px solid var(--border); border-radius:18px; padding:16px; max-width:560px; margin:0 auto; }
  :root[data-display="fullscreen"] .card { width:min(100%, calc(100vw - 32px)); max-width:1040px; margin:16px auto calc(96px + env(safe-area-inset-bottom, 0px)); }
  .head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .title { font-size:16px; font-weight:600; line-height:1.3; }
  .subtitle { color:var(--text-2); font-size:13px; margin-top:2px; }
  .count { color:var(--text-3); font-size:12px; white-space:nowrap; margin-top:2px; text-align:right; }
  .head-side { display:flex; align-items:flex-start; gap:8px; flex-shrink:0; }
  .icon-btn { width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:999px; background:var(--bg); color:var(--text-2); cursor:pointer; }
  .icon-btn:hover { background:var(--bg-secondary); color:var(--text); }
  .icon-btn svg { width:14px; height:14px; stroke:currentColor; }
  :root[data-display="fullscreen"] #expand { display:none; }
  .divider { height:1px; background:var(--border); margin:14px -16px; }
  .helper { color:var(--text-2); font-size:12.5px; margin:-3px 0 12px; }
  .rows { display:flex; flex-direction:column; }
  .class-row {
    position:relative; isolation:isolate;
    width:100%; display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    padding:11px 0; border:0; border-bottom:1px solid var(--border); border-radius:10px;
    background:transparent; color:inherit; font-family:inherit; text-align:left; cursor:pointer;
    transition:color .12s ease;
  }
  .class-row::before {
    content:""; position:absolute; inset:2px -8px; border-radius:10px;
    background:transparent; pointer-events:none; z-index:0;
  }
  .class-row:last-child { border-bottom:none; }
  .class-row:hover .class-name, .class-row:focus-visible .class-name { color:var(--accent); }
  .class-row:focus-visible { outline:none; }
  .class-row:focus-visible::before { background:rgba(2,133,255,.06); }
  .class-row.selected { border-bottom-color:transparent; }
  .class-row.selected::before { background:color-mix(in srgb, var(--accent) 8%, var(--bg)); }
  .class-row.selected + .class-row.selected::before { top:-1px; border-top-left-radius:0; border-top-right-radius:0; }
  .class-row.selected:has(+ .class-row.selected)::before { bottom:-1px; border-bottom-left-radius:0; border-bottom-right-radius:0; }
  .class-row.selected .class-name { color:var(--accent); }
  .class-main { position:relative; z-index:1; min-width:0; flex:1; }
  .class-name { font-size:14px; font-weight:600; line-height:1.3; overflow-wrap:break-word; transition:color .12s ease; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:5px; color:var(--text-2); font-size:12.5px; margin-top:2px; }
  .actions { display:flex; gap:8px; margin-top:16px; }
  .btn { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:inherit; font-size:13.5px; font-weight:600; padding:9px 14px; border-radius:12px; border:1px solid var(--border); background:var(--bg); color:var(--text); text-decoration:none; }
  .btn:hover { background:var(--bg-secondary); }
  .btn svg { width:14px; height:14px; stroke:currentColor; }
  .empty, .empty-state { color:var(--text-3); font-size:13px; padding:16px 0 2px; }
  .empty-title { color:var(--text-2); font-weight:600; font-size:13.5px; }
  .empty-copy { margin-top:2px; color:var(--text-3); }
  @media (max-width:419px) {
    .class-row { gap:8px; }
  }
</style>
</head>
<body>
<div class="card" id="card"><div class="empty">Loading classes...</div></div>
<script>
"use strict";
const card = document.getElementById("card");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';
const EXPAND_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
let selectedClasses = new Set();

function applyHostContext() {
  const t = window.openai?.theme;
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  document.documentElement.dataset.display = window.openai?.displayMode || "inline";
}
let heightFrame = 0;
let lastReportedHeight = 0;
function reportHeight() {
  if (heightFrame) return;
  heightFrame = requestAnimationFrame(() => {
    heightFrame = 0;
    const h = Math.ceil(document.body.scrollHeight);
    if (Math.abs(h - lastReportedHeight) < 2) return;
    lastReportedHeight = h;
    try { window.openai?.notifyIntrinsicHeight?.(h); } catch (_) {}
  });
}
new ResizeObserver(reportHeight).observe(document.body);
function requestFullscreen() {
  try { window.openai?.requestDisplayMode?.({ mode: "fullscreen" }); } catch (_) {}
}
function emptyState(title, copy) {
  return `<div class="empty-state"><div class="empty-title">${esc(title)}</div>${copy ? `<div class="empty-copy">${esc(copy)}</div>` : ""}</div>`;
}
function normalClass(c, i) {
  const name = c.name || c.class_name || c.title || "Class";
  return {
    key: String(c.id || c.class_id || `${name}:${i}`),
    id: c.id || c.class_id || "",
    name,
    teacher: c.teacher || c.teachers || c.advisor || "",
    room: c.room || c.location || "",
    grade: c.grade || c.year || "",
    group: c.group || c.section || "",
    url: c.url || "",
  };
}
function classRow(c) {
  const meta = [c.teacher, c.room, c.grade, c.group].filter(Boolean).map(esc).join(" · ");
  const selected = selectedClasses.has(c.key);
  return `<button class="class-row${selected ? " selected" : ""}" type="button" data-class-key="${esc(c.key)}" aria-pressed="${selected ? "true" : "false"}">
    <div class="class-main">
      <div class="class-name">${esc(c.name)}</div>
      ${meta ? `<div class="meta">${meta}</div>` : ""}
    </div>
  </button>`;
}
function renderClasses(data) {
  const classes = (data.classes || []).map(normalClass);
  selectedClasses = new Set([...selectedClasses].filter((key) => classes.some((c) => c.key === key)));
  const title = data.title || "Classes";
  const subtitle = data.scope || data.subtitle || "ManageBac";
  let h = `<div class="head"><div><div class="title">${esc(title)}</div><div class="subtitle">${esc(subtitle)}</div></div><div class="head-side"><div class="count">${classes.length} ${classes.length === 1 ? "class" : "classes"}</div>${classes.length > 8 ? `<button class="icon-btn" id="expand" type="button" aria-label="Open fullscreen">${EXPAND_ICON}</button>` : ""}</div></div><div class="divider"></div>`;
  if (!classes.length) {
    h += emptyState("No classes found", "ManageBac did not return any classes for this view.");
  } else {
    h += `<div class="helper">Select one or more classes, then ask ChatGPT about the selected classes.</div>
      <div class="rows">${classes.map(classRow).join("")}</div>`;
  }
  if (data.url) h += `<div class="actions"><a class="btn" href="${esc(data.url)}" target="_blank" rel="noopener">${LINK_ICON} Open in ManageBac</a></div>`;
  card.innerHTML = h;
  card.querySelector("#expand")?.addEventListener("click", requestFullscreen);

  function selectedClassObjects() {
    return classes.filter((c) => selectedClasses.has(c.key));
  }
  function saveSelection() {
    const selected = selectedClassObjects().map((c) => ({
      id: c.id,
      name: c.name,
      teacher: c.teacher,
      room: c.room,
      grade: c.grade,
      group: c.group,
    }));
    try { window.openai?.setWidgetState?.({ selected_classes: selected }); } catch (_) {}
  }
  function updateSelection(persist = true) {
    const n = selectedClasses.size;
    const helper = card.querySelector(".helper");
    if (helper) {
      helper.textContent = "Select one or more classes, then ask ChatGPT about the selected classes.";
    }
    card.querySelectorAll("[data-class-key]").forEach((row) => {
      const active = selectedClasses.has(row.dataset.classKey);
      row.classList.toggle("selected", active);
      row.setAttribute("aria-pressed", active ? "true" : "false");
    });
    if (persist) saveSelection();
    reportHeight();
  }
  card.querySelectorAll("[data-class-key]").forEach((row) => {
    row.addEventListener("click", () => {
      const key = row.dataset.classKey;
      if (selectedClasses.has(key)) selectedClasses.delete(key);
      else selectedClasses.add(key);
      updateSelection(true);
    });
  });
  updateSelection(false);
  reportHeight();
}

applyHostContext();
const live = window.openai?.toolOutput;
if (live && Array.isArray(live.classes)) renderClasses(live);
window.addEventListener("message", (ev) => {
  if (ev.source !== window.parent) return;
  const d = ev.data?.params?.structuredContent;
  if (d && Array.isArray(d.classes)) renderClasses(d);
}, { passive:true });
window.addEventListener("openai:set_globals", (ev) => {
  applyHostContext();
  const d = ev.detail?.globals?.toolOutput ?? window.openai?.toolOutput;
  if (d && Array.isArray(d.classes)) renderClasses(d);
}, { passive:true });
// Safety net: ChatGPT draws the widget frame from the tool template even when
// the call errors or the payload is dropped — never spin forever. If nothing
// has rendered after 8s, show a quiet empty state instead of the loader.
setTimeout(() => {
  if (!card.querySelector(".head")) {
    card.innerHTML = '<div style="color:var(--text-3);font-size:13px;padding:14px 0;text-align:center">Nothing to show right now \u2014 ask ChatGPT to try again.</div>';
    reportHeight();
  }
}, 8000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grades</title>
<style>
  :root {
    --bg:#FFFFFF; --bg-secondary:#F3F3F3; --text:#0D0D0D; --text-2:#5D5D5D; --text-3:#8F8F8F;
    --border:rgba(13,13,13,.09); --accent:#0285FF; --track:#E8E8E8; --green:#008635;
  }
  :root[data-theme="dark"] {
    --bg:#212121; --bg-secondary:#303030; --text:#FFFFFF; --text-2:#CDCDCD; --text-3:#AFAFAF;
    --border:rgba(255,255,255,.10); --accent:#0285FF; --track:#414141; --green:#40C977;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#212121; --bg-secondary:#303030; --text:#FFFFFF; --text-2:#CDCDCD; --text-3:#AFAFAF;
      --border:rgba(255,255,255,.10); --track:#414141; --green:#40C977;
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:transparent; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--text); -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.45;
  }
  .card { background:var(--bg); border:1px solid var(--border); border-radius:18px; padding:16px; max-width:560px; margin:0 auto; }
  :root[data-display="fullscreen"] .card { max-width:720px; margin:16px auto calc(96px + env(safe-area-inset-bottom, 0px)); }
  .head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .title { font-size:16px; font-weight:600; line-height:1.3; }
  .subtitle { color:var(--text-2); font-size:13px; margin-top:2px; }
  .head-side { display:flex; align-items:flex-start; gap:8px; flex-shrink:0; }
  .count { color:var(--text-3); font-size:12px; white-space:nowrap; margin-top:2px; text-align:right; }
  .icon-btn { width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--border); border-radius:999px; background:var(--bg); color:var(--text-2); cursor:pointer; }
  .icon-btn:hover { background:var(--bg-secondary); color:var(--text); }
  .icon-btn svg { width:14px; height:14px; stroke:currentColor; }
  .divider { height:1px; background:var(--border); margin:14px -16px; }
  .section-label { font-size:11.5px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
  .class-row { padding:12px 0; border-bottom:1px solid var(--border); }
  .class-row:last-child { border-bottom:none; }
  .class-name { font-size:14px; font-weight:600; line-height:1.3; min-width:0; }
  .hint { color:var(--text-3); font-size:12px; margin-top:8px; }
  .actions { display:flex; gap:8px; margin-top:16px; }
  .btn { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:inherit; font-size:13.5px; font-weight:600; padding:9px 14px; border-radius:12px; cursor:pointer; border:1px solid var(--border); background:var(--bg); color:var(--text); text-decoration:none; }
  .btn:hover { background:var(--bg-secondary); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.primary:hover { background:#0270DB; }
  .btn svg { width:14px; height:14px; stroke:currentColor; }
  .empty { color:var(--text-3); font-size:13px; padding:16px 0 2px; }

  /* Final grade (emphasised) */
  .final { text-align:right; flex-shrink:0; line-height:1; }
  .final-num { font-size:24px; font-weight:700; color:var(--text); }
  .final-num .of { font-size:13px; font-weight:600; color:var(--text-3); }
  .final-label { font-size:10px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; margin-top:3px; }
  .final-num.na { font-size:15px; color:var(--text-3); font-weight:600; }

  /* Inline criteria */
  .crit-inline { font-size:12.5px; color:var(--text-2); }
  .crit-inline b { color:var(--text); font-weight:600; }
  .crit-inline .sep { color:var(--text-3); margin:0 5px; }

  .row-a { display:flex; align-items:center; gap:14px; }
  .row-a .grow { flex:1; min-width:0; }
  .row-a .class-name { margin-bottom:3px; }
  @media (max-width:439px) { .row-a { flex-wrap:wrap; } .row-a .final { order:2; margin-left:auto; } }

  .row-b .class-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .grade-bar { position:relative; height:8px; border-radius:999px; background:var(--track); overflow:hidden; margin:9px 0 8px; }
  .grade-bar-fill { position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--accent); }

  /* Criterion bars */
  .crit-list { margin-top:12px; display:flex; flex-direction:column; gap:9px; }
  .crit { display:flex; align-items:center; gap:10px; }
  .crit-key { width:14px; font-size:12px; font-weight:600; color:var(--text-2); flex-shrink:0; }
  .crit-viz { flex:1; min-width:0; }
  .crit-score { font-size:12px; color:var(--text-2); white-space:nowrap; flex-shrink:0; min-width:30px; text-align:right; }
  .crit-score b { color:var(--text); font-weight:600; font-size:13px; }
  .bar-track { position:relative; height:6px; border-radius:999px; background:var(--track); overflow:hidden; }
  .bar-fill { position:absolute; left:0; top:0; bottom:0; border-radius:999px; background:var(--accent); }
  .bar-best { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--text-3); border-radius:1px; }

  /* Overall summary */
  .overall { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
  .overall-label { font-size:13px; font-weight:600; }
  .overall-val { font-size:22px; font-weight:700; }
  .overall-val.na { font-size:15px; color:var(--text-3); }

  /* ── Edit mode ───────────────────────────────────────────────────────── */
  .slider-row { padding:10px 0; border-bottom:1px solid var(--border); }
  .slider-row:last-of-type { border-bottom:none; }
  .slider-label { display:flex; align-items:baseline; justify-content:space-between; gap:10px; font-size:13.5px; margin-bottom:9px; }
  .slider-label b { font-weight:600; }
  .slider-label .val { flex-shrink:0; font-size:12.5px; color:var(--text-3); }
  .slider-label .val b { color:var(--text); font-weight:600; font-size:14px; }
  .na-tag { font-size:12px; color:var(--text-3); font-style:italic; }

  /* Slider styled to read like the bar chart: filled track + draggable thumb */
  input[type=range].slider { -webkit-appearance:none; appearance:none; width:100%; height:16px; background:transparent; cursor:grab; margin:0; display:block; }
  input[type=range].slider:active { cursor:grabbing; }
  input[type=range].slider::-webkit-slider-runnable-track {
    height:6px; border-radius:999px; background-color:var(--track);
    background-image:linear-gradient(var(--accent),var(--accent)); background-repeat:no-repeat;
    background-size:var(--fill,50%) 100%;
  }
  input[type=range].slider::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none; margin-top:-5px;
    width:16px; height:16px; border-radius:50%; background:var(--bg); border:2px solid var(--accent);
    box-shadow:0 1px 3px rgba(0,0,0,.18); transition:transform .1s ease;
  }
  input[type=range].slider:hover::-webkit-slider-thumb { transform:scale(1.2); box-shadow:0 0 0 6px rgba(2,133,255,.12); }
  input[type=range].slider:active::-webkit-slider-thumb { transform:scale(1.2); }
  input[type=range].slider:focus-visible::-webkit-slider-thumb { outline:2px solid var(--accent); outline-offset:3px; }
  input[type=range].slider::-moz-range-track { height:6px; border-radius:999px; background:var(--track); }
  input[type=range].slider::-moz-range-progress { height:6px; border-radius:999px; background:var(--accent); }
  input[type=range].slider::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:var(--bg); border:2px solid var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.18); }
  input[type=range].slider:hover::-moz-range-thumb { box-shadow:0 0 0 6px rgba(2,133,255,.12); }

  .edit-summary { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding-top:12px; border-top:1px solid var(--border); }
  .edit-summary .lbl { font-size:13px; font-weight:600; }
  .edit-summary .big { font-size:24px; font-weight:700; }
  .edit-summary .big .of { font-size:13px; font-weight:600; color:var(--text-3); }
  .edit-summary .big.na { font-size:15px; color:var(--text-3); }
  .delta { font-size:12px; color:var(--text-3); }
  .delta.up { color:var(--green); }
</style>
</head>
<body>
<div class="card" id="card"><div class="empty">Loading grades...</div></div>
<script>
"use strict";
const card = document.getElementById("card");
const CRIT = ["A", "B", "C", "D"];
const MAXSCORE = 8, MAXGRADE = 7;
const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';
const EDIT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const EXPAND_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
const SPARKLE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg>';
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function gradeStyle() { return window.__GRADE_STYLE === "bar" ? "bar" : "inline"; }
function applyHostContext() {
  const t = window.openai?.theme;
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
  document.documentElement.dataset.display = window.openai?.displayMode || "inline";
}
function reportHeight() { try { window.openai?.notifyIntrinsicHeight?.(document.body.scrollHeight); } catch (_) {} }
new ResizeObserver(() => reportHeight()).observe(document.body);
function requestFullscreen() { try { window.openai?.requestDisplayMode?.({ mode: "fullscreen" }); } catch (_) {} }
function askChatGPT(prompt) { try { window.openai?.sendFollowUpMessage?.({ prompt }); } catch (_) {} }

// Final IB MYP grade (1-7) from criterion scores. null = not enough data.
function finalGrade(scoresByCrit) {
  let total = 0, n = 0;
  for (const k of CRIT) {
    const v = scoresByCrit?.[k];
    if (typeof v === "number") { total += v; n++; }
  }
  if (!n) return null;
  const scaled = total * (4 / n);
  let level = 1;
  if (scaled >= 28) level = 7; else if (scaled >= 24) level = 6; else if (scaled >= 19) level = 5;
  else if (scaled >= 15) level = 4; else if (scaled >= 10) level = 3; else if (scaled >= 6) level = 2;
  return level;
}
// latest score per criterion → plain {A:7,B:6,...} (missing omitted)
function latestScores(criteria) {
  const out = {};
  for (const k of CRIT) {
    const c = criteria?.[k];
    if (c && typeof c.latest === "number") out[k] = c.latest;
  }
  return out;
}
function overallOf(levels) {
  const vals = levels.filter((v) => typeof v === "number");
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
function fmtOverall(v) { return v == null ? "N/A" : (Math.round(v * 10) / 10).toFixed(1); }

function finalGradeEl(level) {
  if (level == null) return `<div class="final"><div class="final-num na">N/A</div><div class="final-label">Final grade</div></div>`;
  return `<div class="final"><div class="final-num">${level}<span class="of">/7</span></div><div class="final-label">Final grade</div></div>`;
}
function critInline(criteria) {
  return CRIT.map((k) => {
    const c = criteria?.[k];
    return c && typeof c.latest === "number" ? `${k} <b>${esc(c.latest)}</b>` : "";
  }).filter(Boolean).join('<span class="sep">·</span>');
}
function barRow(k, latest, best) {
  const fill = Math.max(0, Math.min(1, latest / MAXSCORE)) * 100;
  const bestPct = typeof best === "number" ? Math.max(0, Math.min(1, best / MAXSCORE)) * 100 : null;
  return `<div class="crit"><div class="crit-key">${k}</div>
    <div class="crit-viz"><div class="bar-track"><div class="bar-fill" style="width:${fill.toFixed(1)}%"></div>
    ${bestPct !== null && best > latest ? `<div class="bar-best" style="left:${bestPct.toFixed(1)}%"></div>` : ""}</div></div>
    <div class="crit-score"><b>${esc(latest)}</b>/8</div></div>`;
}

// ── READ MODE ─────────────────────────────────────────────────────────────
function classRowInline(cls) {
  const level = finalGrade(latestScores(cls.criteria));
  const inline = critInline(cls.criteria || {});
  return `<div class="class-row row-a"><div class="grow"><div class="class-name">${esc(cls.class_name || "Class")}</div>
    ${inline ? `<div class="crit-inline">${inline}</div>` : `<div class="crit-inline">No grades yet</div>`}</div>${finalGradeEl(level)}</div>`;
}
function classRowBar(cls) {
  const level = finalGrade(latestScores(cls.criteria));
  const inline = critInline(cls.criteria || {});
  const fill = level != null ? (level / MAXGRADE) * 100 : 0;
  return `<div class="class-row row-b"><div class="class-top"><div class="class-name">${esc(cls.class_name || "Class")}</div>${finalGradeEl(level)}</div>
    <div class="grade-bar"><div class="grade-bar-fill" style="width:${fill.toFixed(1)}%"></div></div>
    ${inline ? `<div class="crit-inline">${inline}</div>` : `<div class="crit-inline">No grades yet</div>`}</div>`;
}
function classRowDetail(cls) {
  const level = finalGrade(latestScores(cls.criteria));
  const present = CRIT.filter((k) => cls.criteria?.[k] && typeof cls.criteria[k].latest === "number");
  const bars = present.map((k) => barRow(k, cls.criteria[k].latest, cls.criteria[k].best)).join("");
  return `<div class="class-row row-b"><div class="class-top"><div class="class-name">${esc(cls.class_name || "Class")}</div>${finalGradeEl(level)}</div>
    ${present.length ? `<div class="crit-list">${bars}</div>` : `<div class="crit-inline">Not enough data yet</div>`}</div>`;
}

function renderRead(data) {
  const classes = (data.classes || []).filter(Boolean);
  const single = classes.length === 1;
  let h = header(data, classes.length);
  h += `<div class="divider"></div>`;
  if (!classes.length) {
    h += `<div class="empty">No grades found.</div>`;
  } else if (single) {
    h += `<div class="section-label">Class</div>` + classRowDetail(classes[0]);
    h += `<div class="hint">Final grade is a rough estimate from your latest scores; teachers use best-fit.</div>`;
  } else {
    h += `<div class="section-label">Classes</div>`;
    h += classes.map(gradeStyle() === "bar" ? classRowBar : classRowInline).join("");
    const overall = overallOf(classes.map((c) => finalGrade(latestScores(c.criteria))));
    h += `<div class="overall"><div class="overall-label">Overall</div><div class="overall-val${overall == null ? " na" : ""}">${overall == null ? "N/A" : fmtOverall(overall)}${overall == null ? "" : '<span class="of" style="font-size:13px;font-weight:600;color:var(--text-3)"> /7</span>'}</div></div>`;
    h += `<div class="hint">Overall is the average of your class final grades. Estimates use latest scores; teachers use best-fit.</div>`;
  }
  h += `<div class="actions">
    <button class="btn" id="edit">${EDIT_ICON} Edit &amp; predict</button>
    ${data.url ? `<a class="btn primary" href="${esc(data.url)}" target="_blank" rel="noopener">${LINK_ICON} Open in ManageBac</a>` : ""}
  </div>`;
  card.innerHTML = h;
  card.querySelector("#expand")?.addEventListener("click", requestFullscreen);
  card.querySelector("#edit")?.addEventListener("click", () => enterEdit(data));
  reportHeight();
}

function header(data, count) {
  return `<div class="head"><div><div class="title">Grades</div>${data.scope ? `<div class="subtitle">${esc(data.scope)}</div>` : ""}</div>
    <div class="head-side"><div class="count">${count} ${count === 1 ? "class" : "classes"}</div>
    <button class="icon-btn" id="expand" type="button" aria-label="Open fullscreen">${EXPAND_ICON}</button></div></div>`;
}

// ── EDIT MODE ─────────────────────────────────────────────────────────────
let editState = null;

function enterEdit(data) {
  const classes = (data.classes || []).filter(Boolean);
  const single = classes.length === 1;
  if (single) {
    const base = latestScores(classes[0].criteria);
    editState = { data, mode: "single", className: classes[0].class_name || "this class",
      keys: CRIT.filter((k) => k in base), values: { ...base }, base: { ...base } };
  } else {
    const levels = {}, base = {}, names = {};
    classes.forEach((c, i) => {
      const lvl = finalGrade(latestScores(c.criteria));
      levels[i] = lvl; base[i] = lvl; names[i] = c.class_name || `Class ${i + 1}`;
    });
    editState = { data, mode: "overall", classes, names, values: levels, base };
  }
  renderEdit();
}

function editSliderRow(id, labelHtml, value, min, max, suffix) {
  const fill = ((value - min) / (max - min)) * 100;
  return `<div class="slider-row">
    <div class="slider-label"><span>${labelHtml}</span><span class="val" id="val-${id}"><b>${value}</b>${suffix}</span></div>
    <input type="range" class="slider" data-id="${id}" min="${min}" max="${max}" step="1" value="${value}"
      style="--fill:${fill.toFixed(1)}%" aria-label="${labelHtml.replace(/<[^>]+>/g, "")}">
  </div>`;
}
function editNARow(labelHtml) {
  return `<div class="slider-row"><div class="slider-label"><span>${labelHtml}</span><span class="na-tag">N/A · no data</span></div></div>`;
}

function summaryInner(value, was, isOverall) {
  const fmt = isOverall ? fmtOverall : (v) => String(v);
  const na = value == null;
  const up = value != null && was != null && value > was;
  let wasTxt = "";
  if (was != null) {
    const same = isOverall ? Math.abs(value - was) < 0.05 : value === was;
    wasTxt = same ? " (unchanged)" : ` (was ${fmt(was)})`;
  }
  const big = na ? "N/A" : `${fmt(value)}<span class="of">/7</span>`;
  return `<div class="lbl">${isOverall ? "Projected overall" : "Projected final grade"}</div>
    <div><span class="big${na ? " na" : ""}">${big}</span> <span class="delta${up ? " up" : ""}">${wasTxt}</span></div>`;
}

function renderEdit() {
  const st = editState;
  let h = header(st.data, (st.data.classes || []).filter(Boolean).length);
  h += `<div class="divider"></div>`;

  if (st.mode === "single") {
    h += `<div class="section-label">${esc(st.className)}</div>`;
    if (!st.keys.length) {
      h += `<div class="empty">Not enough data to predict a grade for this class yet.</div>`;
    } else {
      for (const k of st.keys) h += editSliderRow(k, `Criterion <b>${k}</b>`, st.values[k], 0, MAXSCORE, "/8");
      const proj = finalGrade(st.values), was = finalGrade(st.base);
      h += `<div class="edit-summary" id="summary-slot">${summaryInner(proj, was, false)}</div>`;
    }
  } else {
    h += `<div class="section-label">Predict overall grade</div>`;
    st.classes.forEach((c, i) => {
      if (st.base[i] == null) h += editNARow(`<b>${esc(st.names[i])}</b>`);
      else h += editSliderRow(String(i), `<b>${esc(st.names[i])}</b>`, st.values[i], 1, MAXGRADE, "/7");
    });
    const proj = overallOf(Object.keys(st.values).map((i) => st.base[i] == null ? null : st.values[i]));
    const was = overallOf(Object.values(st.base));
    h += `<div class="edit-summary" id="summary-slot">${summaryInner(proj, was, true)}</div>`;
  }

  h += `<div class="actions">
    <button class="btn primary" id="improve">${SPARKLE_ICON} Ask how to improve</button>
    <button class="btn" id="done">Done</button>
  </div>`;
  h += `<div class="hint">Drag a slider to set a target score, then ask ChatGPT for a concrete plan to reach it using your real tasks and feedback.</div>`;

  card.innerHTML = h;
  card.querySelector("#expand")?.addEventListener("click", requestFullscreen);
  card.querySelector("#done")?.addEventListener("click", () => renderRead(st.data));
  card.querySelector("#improve")?.addEventListener("click", askImprove);
  // Live, in-place updates on drag — no re-render, so the drag stays smooth.
  card.querySelectorAll("input.slider").forEach((inp) => inp.addEventListener("input", () => onSlide(inp)));
  reportHeight();
}

function onSlide(inp) {
  const st = editState;
  const id = inp.dataset.id;
  const min = st.mode === "single" ? 0 : 1;
  const max = st.mode === "single" ? MAXSCORE : MAXGRADE;
  const suffix = st.mode === "single" ? "/8" : "/7";
  const v = parseInt(inp.value, 10);
  st.values[id] = v;
  inp.style.setProperty("--fill", (((v - min) / (max - min)) * 100).toFixed(1) + "%");
  const valEl = document.getElementById("val-" + id);
  if (valEl) valEl.innerHTML = `<b>${v}</b>${suffix}`;
  const slot = document.getElementById("summary-slot");
  if (slot) {
    if (st.mode === "single") {
      slot.innerHTML = summaryInner(finalGrade(st.values), finalGrade(st.base), false);
    } else {
      const proj = overallOf(Object.keys(st.values).map((i) => st.base[i] == null ? null : st.values[i]));
      slot.innerHTML = summaryInner(proj, overallOf(Object.values(st.base)), true);
    }
  }
}

function askImprove() {
  const st = editState;
  let prompt;
  if (st.mode === "single") {
    const cur = st.keys.map((k) => `${k} ${st.base[k]}/8`).join(", ");
    const tgt = st.keys.map((k) => `${k} ${st.values[k]}/8`).join(", ");
    const projG = finalGrade(st.values), wasG = finalGrade(st.base);
    prompt = `In ${st.className}, my latest criterion scores are ${cur} (estimated final grade ${wasG ?? "N/A"}). ` +
      `I'm aiming for ${tgt} (final grade ${projG ?? "N/A"}). Look over my tasks, teacher feedback, and the rubric ` +
      `in this class and give me specific, concrete steps to raise each criterion to my target.`;
  } else {
    const cur = st.classes.map((c, i) => st.base[i] == null ? null : `${st.names[i]} ${st.base[i]}/7`).filter(Boolean).join(", ");
    const tgt = st.classes.map((c, i) => st.base[i] == null ? null : `${st.names[i]} ${st.values[i]}/7`).filter(Boolean).join(", ");
    const projO = overallOf(Object.keys(st.values).map((i) => st.base[i] == null ? null : st.values[i]));
    const wasO = overallOf(Object.values(st.base));
    prompt = `My current class grades are ${cur} (overall ${fmtOverall(wasO)}/7). I'm targeting ${tgt} (overall ${fmtOverall(projO)}/7). ` +
      `Look across all my classes, tasks, and feedback and tell me where I can most realistically improve to reach these targets, ` +
      `and what to prioritise first.`;
  }
  askChatGPT(prompt);
}

// ── Entry ─────────────────────────────────────────────────────────────────
let lastData = null;
function render(data) { lastData = data; editState = null; renderRead(data); }
window.__rerenderGrades = () => { if (lastData) render(lastData); };

applyHostContext();
const live = window.openai?.toolOutput;
if (live && Array.isArray(live.classes)) render(live);
window.addEventListener("message", (ev) => {
  if (ev.source !== window.parent) return;
  const d = ev.data?.params?.structuredContent;
  if (d && Array.isArray(d.classes)) render(d);
}, { passive:true });
window.addEventListener("openai:set_globals", (ev) => {
  applyHostContext();
  const d = ev.detail?.globals?.toolOutput ?? window.openai?.toolOutput;
  if (d && Array.isArray(d.classes)) render(d);
}, { passive:true });
</script>

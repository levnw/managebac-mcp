const frame = document.getElementById("frame");
const logEl = document.getElementById("log");
const scenarioSel = document.getElementById("scenario");
const widgetSel = document.getElementById("widget");
let dark = false;
let gradeStyle = "inline";
let displayMode = "inline";
let widthPreset = 560;

function scenariosForWidget() {
  if (widgetSel.value === "task-list.html") return TASK_LIST_SCENARIOS;
  if (widgetSel.value === "grades-card.html") return GRADES_SCENARIOS;
  if (widgetSel.value === "timetable-card.html") return TIMETABLE_SCENARIOS;
  if (widgetSel.value === "class-files.html") return FILE_SCENARIOS;
  return SCENARIOS;
}

function refreshScenarios() {
  const options = scenariosForWidget();
  scenarioSel.innerHTML = "";
  for (const name of Object.keys(options)) {
    const o = document.createElement("option");
    o.value = name; o.textContent = name;
    scenarioSel.appendChild(o);
  }
}

window.__harnessLog = (line) => {
  logEl.innerHTML = `<b>${line}</b>\n` + logEl.innerHTML;
};

function mockScript(data, theme) {
  return `<script>
    window.__GRADE_STYLE = ${JSON.stringify(gradeStyle)};
    window.openai = {
      toolOutput: ${JSON.stringify(data)},
      toolInput: {},
      theme: ${JSON.stringify(theme)},
      displayMode: ${JSON.stringify(displayMode)},
      maxHeight: 900,
      locale: "en-US",
      widgetState: null,
      setWidgetState(s) { this.widgetState = s; parent.__harnessLog("setWidgetState(" + JSON.stringify(s) + ")"); },
      notifyIntrinsicHeight(h) { parent.__harnessLog("notifyIntrinsicHeight(" + h + ")"); },
      openExternal({ href }) { parent.__harnessLog("openExternal(" + href + ")"); },
      requestDisplayMode({ mode }) {
        this.displayMode = mode;
        parent.__harnessLog("requestDisplayMode(" + mode + ")");
        window.dispatchEvent(new CustomEvent("openai:set_globals", { detail: { globals: window.openai } }));
        return Promise.resolve({ mode });
      },
      callTool(name, args) { parent.__harnessLog("callTool(" + name + ", " + JSON.stringify(args) + ")"); return Promise.resolve({ structuredContent: null }); },
      sendFollowUpMessage({ prompt }) { parent.__harnessLog("sendFollowUpMessage(" + prompt + ")"); },
    };
  <\/script>`;
}

async function load() {
  const widget = widgetSel.value;
  const data = scenariosForWidget()[scenarioSel.value];
  const theme = dark ? "dark" : "light";
  document.getElementById("gradestyle").style.display = widget === "grades-card.html" ? "" : "none";
  frame.style.width = displayMode === "fullscreen" ? "900px" : widthPreset + "px";
  frame.style.height = displayMode === "fullscreen" ? "1000px" : "600px";
  const res = await fetch(widget + "?t=" + Date.now());
  let html = await res.text();
  html = html.replace("<head>", "<head>" + mockScript(data, theme));
  frame.srcdoc = html;
  logEl.innerHTML = "— window.openai calls appear here —";
}

document.getElementById("theme").addEventListener("click", (e) => {
  dark = !dark;
  document.body.classList.toggle("dark", dark);
  e.target.textContent = dark ? "☀️ Light" : "🌙 Dark";
  load();
});
document.getElementById("gradestyle").addEventListener("click", (e) => {
  gradeStyle = gradeStyle === "inline" ? "bar" : "inline";
  e.target.textContent = gradeStyle === "inline" ? "Style: Inline" : "Style: Bar";
  load();
});
document.getElementById("fsmode").addEventListener("click", (e) => {
  displayMode = displayMode === "inline" ? "fullscreen" : "inline";
  e.target.textContent = displayMode === "inline" ? "⛶ Fullscreen" : "⛶ Inline";
  e.target.classList.toggle("active", displayMode === "fullscreen");
  load();
});
for (const [id, w] of [["w-mobile", 360], ["w-mid", 480], ["w-full", 560]]) {
  document.getElementById(id).addEventListener("click", (e) => {
    widthPreset = w;
    if (displayMode !== "fullscreen") frame.style.width = w + "px";
    document.querySelectorAll(".bar button.ctl").forEach((b) => b.id.startsWith("w-") && b.classList.remove("active"));
    e.target.classList.add("active");
  });
}
scenarioSel.addEventListener("change", load);
widgetSel.addEventListener("change", () => { refreshScenarios(); load(); });
refreshScenarios();
load();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task</title>
<style>
  /* ── Design tokens — OpenAI Apps SDK palette (light) ─────────────────── */
  :root {
    --bg:            #FFFFFF;
    --bg-secondary:  #F3F3F3;
    --bg-tertiary:   #E8E8E8;
    --text:          #0D0D0D;
    --text-2:        #5D5D5D;
    --text-3:        #8F8F8F;
    --border:        rgba(13,13,13,.09);
    --accent:        #0285FF;
    --red:           #E02E2A;
    --orange:        #E25507;
    --green:         #008635;
    --tint-red:      rgba(224,46,42,.08);
    --tint-orange:   rgba(226,85,7,.08);
    --tint-green:    rgba(0,134,53,.08);
    --tint-blue:     rgba(2,133,255,.08);
  }
  :root[data-theme="dark"] {
    --bg:            #212121;
    --bg-secondary:  #303030;
    --bg-tertiary:   #414141;
    --text:          #FFFFFF;
    --text-2:        #CDCDCD;
    --text-3:        #AFAFAF;
    --border:        rgba(255,255,255,.10);
    --accent:        #0285FF;
    --red:           #FF8583;
    --orange:        #FF9E6C;
    --green:         #40C977;
    --tint-red:      rgba(255,133,131,.12);
    --tint-orange:   rgba(255,158,108,.12);
    --tint-green:    rgba(64,201,119,.12);
    --tint-blue:     rgba(2,133,255,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:            #212121;
      --bg-secondary:  #303030;
      --bg-tertiary:   #414141;
      --text:          #FFFFFF;
      --text-2:        #CDCDCD;
      --text-3:        #AFAFAF;
      --border:        rgba(255,255,255,.10);
      --red:           #FF8583;
      --orange:        #FF9E6C;
      --green:         #40C977;
      --tint-red:      rgba(255,133,131,.12);
      --tint-orange:   rgba(255,158,108,.12);
      --tint-green:    rgba(64,201,119,.12);
      --tint-blue:     rgba(2,133,255,.14);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.45;
  }

  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    max-width: 560px;
    margin: 0 auto;
  }

  /* ── Header row: title/class left, due right ─────────────────────────── */
  .head { display: flex; gap: 12px; align-items: flex-start; }
  .head-main { flex: 1; min-width: 0; }
  .title { font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: break-word; }
  .klass { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .due { text-align: right; flex-shrink: 0; }
  .due-date { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .due-date.overdue { color: var(--red); }
  .due-time { font-size: 11.5px; color: var(--text-3); white-space: nowrap; margin-top: 1px; }

  /* ── Badges ───────────────────────────────────────────────────────────── */
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .badge {
    font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px;
    background: var(--bg-secondary); color: var(--text-2);
  }
  .badge.b-summative { background: var(--tint-orange); color: var(--orange); }
  .badge.b-formative { background: var(--tint-blue);   color: var(--accent); }
  .badge.b-status-done    { background: var(--tint-green);  color: var(--green); }
  .badge.b-status-pending { background: var(--tint-orange); color: var(--orange); }
  .badge.b-status-late    { background: var(--tint-red);    color: var(--red); }
  .badge .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 4px; vertical-align: 1px; }

  /* ── Grades ───────────────────────────────────────────────────────────── */
  .grades { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .grade {
    display: flex; align-items: baseline; gap: 4px;
    background: var(--bg-secondary); border-radius: 10px; padding: 4px 9px;
    font-size: 12px; color: var(--text-2);
  }
  .grade b { font-size: 13px; font-weight: 600; color: var(--text); }
  .grade span { color: var(--text-3); font-size: 11px; }

  /* ── Sections ─────────────────────────────────────────────────────────── */
  .section { margin-top: 14px; }
  .section-label {
    font-size: 11.5px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px;
  }
  .desc { font-size: 13.5px; color: var(--text-2); overflow-wrap: break-word; }
  .desc.clamped {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .desc p + p, .desc p + ol, .desc ol + p, .desc p + ul { margin-top: 6px; }
  .desc ol, .desc ul { padding-left: 20px; }
  .desc a { color: var(--accent); text-decoration: none; }
  .desc strong { color: var(--text); }
  .comment { font-size: 13.5px; color: var(--text-2); }
  .comment.clamped {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ── Files ────────────────────────────────────────────────────────────── */
  .files { display: flex; flex-direction: column; gap: 6px; }
  .file {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 12px;
    text-decoration: none; color: var(--text);
  }
  .file:hover { background: var(--bg-secondary); }
  .file svg { width: 15px; height: 15px; stroke: var(--text-3); flex-shrink: 0; }
  .file-name { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { font-size: 11.5px; color: var(--text-3); flex-shrink: 0; }
  .more-row { font-size: 12.5px; color: var(--text-3); padding: 2px 2px 0; }

  /* ── Expanded-only detail ─────────────────────────────────────────────── */
  #detail { display: none; }
  .card.expanded #detail { display: block; }
  .unit-row { font-size: 12.5px; color: var(--text-3); margin-top: 12px; }
  .unit-row b { color: var(--text-2); font-weight: 500; }
  .disc { padding: 8px 0; border-top: 1px solid var(--border); }
  .disc:first-of-type { border-top: none; padding-top: 2px; }
  .disc-author { font-size: 12.5px; font-weight: 600; }
  .disc-body { font-size: 13px; color: var(--text-2); margin-top: 2px; }
  .disc-date { font-size: 11px; color: var(--text-3); margin-top: 2px; }

  /* ── Actions ──────────────────────────────────────────────────────────── */
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  @media (max-width: 419px) { .actions { flex-direction: column; } }
  .btn {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit; font-size: 13.5px; font-weight: 600;
    padding: 9px 14px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    transition: background .12s ease;
  }
  .btn:hover { background: var(--bg-secondary); }
  .btn:active { background: var(--bg-tertiary); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #0270DB; }
  .btn svg { width: 14px; height: 14px; stroke: currentColor; }

  /* ── Loading / empty ──────────────────────────────────────────────────── */
  .loading { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 0; }
  .ring {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid var(--bg-tertiary); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--text-3); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="loading"><div class="ring"></div><div class="loading-text">Loading task…</div></div>
</div>

<script>
"use strict";
// ═══════════════════════════════════════════════════════════════════════════
// ChatGPT-native task card. Reads the same structuredContent shape the old
// (archived) card did — built by _build_task_obj + _cap_task_widget_sc in
// server.py. See widget-preview/archive/README.md for the full data contract.
// ═══════════════════════════════════════════════════════════════════════════

const card = document.getElementById("card");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const FILE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';

// ── Theme ────────────────────────────────────────────────────────────────
function applyTheme() {
  const t = window.openai?.theme;
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
}

// ── Height reporting ─────────────────────────────────────────────────────
function reportHeight() {
  try { window.openai?.notifyIntrinsicHeight?.(document.body.scrollHeight); } catch (_) {}
}
new ResizeObserver(() => reportHeight()).observe(document.body);

// ── Helpers ──────────────────────────────────────────────────────────────
function statusBadge(task) {
  const s = (task.status || "").toLowerCase();
  if (!s || s === "n/a") return "";
  const done = s === "submitted" || s === "complete";
  const late = !done && task.due_past && (s === "pending" || s === "not submitted" || s === "incomplete");
  const cls = done ? "b-status-done" : late ? "b-status-late" : "b-status-pending";
  const text = late && s !== "incomplete" ? "Overdue" : task.status;
  return `<span class="badge ${cls}"><span class="dot"></span>${esc(text)}</span>`;
}

function labelBadges(task) {
  return (task.labels || []).slice(0, 3).map((l) => {
    const t = (l.text || "").toLowerCase();
    const cls = t === "summative" ? "b-summative" : t === "formative" ? "b-formative" : "";
    return `<span class="badge ${cls}">${esc(l.text)}</span>`;
  }).join("");
}

function allFiles(task) {
  const out = [];
  for (const f of task.desc_files || []) out.push({ name: f.name, meta: f.size || "", url: f.url });
  for (const r of task.resources || [])
    for (const f of r.files || []) out.push({ name: f.name, meta: f.size || "", url: f.url });
  return out;
}

function fileRow(f) {
  return `<a class="file" href="${esc(f.url)}" target="_blank" rel="noopener">${FILE_ICON}<span class="file-name">${esc(f.name)}</span><span class="file-meta">${esc(f.meta)}</span></a>`;
}

// ── Render ───────────────────────────────────────────────────────────────
let currentTask = null;

function render(task) {
  currentTask = task;
  const files = allFiles(task);
  const submitted = task.submitted_files; // null = no dropbox, [] = empty dropbox
  const overdueUnsubmitted = task.due_past && submitted !== null &&
    (!submitted || !submitted.length) &&
    !["submitted", "complete"].includes((task.status || "").toLowerCase());

  let h = "";

  // Header
  h += `<div class="head"><div class="head-main">
          <div class="title">${esc(task.title)}</div>
          ${task.class_name ? `<div class="klass">${esc(task.class_name)}</div>` : ""}
        </div>`;
  if (task.due_month && task.due_day) {
    h += `<div class="due">
            <div class="due-date${overdueUnsubmitted ? " overdue" : ""}">${esc(task.due_month)} ${esc(task.due_day)}</div>
            ${task.due_time ? `<div class="due-time">${esc(task.due_time)}</div>` : ""}
          </div>`;
  }
  h += `</div>`;

  // Badges (type/tags + status)
  const badges = labelBadges(task) + statusBadge(task);
  if (badges) h += `<div class="badges">${badges}</div>`;

  // Grades
  if (task.grades && task.grades.length) {
    h += `<div class="grades">` + task.grades.map((g) =>
      `<div class="grade">${esc(g.label)} <b>${esc(g.score)}</b><span>/ ${esc(g.max)}</span></div>`
    ).join("") + `</div>`;
  }

  // Description preview (clamped when collapsed; description is server-sanitized HTML)
  if (task.description) {
    h += `<div class="section"><div class="desc clamped" id="desc">${task.description}</div></div>`;
  }

  // Teacher comment preview
  if (task.teacher_comment) {
    h += `<div class="section"><div class="section-label">Teacher feedback</div>
          <div class="comment clamped" id="comment">${esc(task.teacher_comment)}</div></div>`;
  }

  // Attachments: first 2 inline, rest behind "+ N more"
  if (files.length) {
    h += `<div class="section"><div class="section-label">Attachments</div><div class="files">`;
    h += files.slice(0, 2).map(fileRow).join("");
    h += `</div>${files.length > 2 ? `<div class="more-row" id="more-files">+ ${files.length - 2} more</div>` : ""}</div>`;
  }

  // Submission state (compact — full list in detail)
  if (submitted && submitted.length) {
    const f = submitted[0];
    h += `<div class="section"><div class="section-label">Your submission</div><div class="files">` +
         fileRow({ name: f.name, meta: f.uploaded || "", url: f.url }) +
         `</div>${submitted.length > 1 ? `<div class="more-row">+ ${submitted.length - 1} more</div>` : ""}</div>`;
  } else if (submitted && !submitted.length && !task.due_past) {
    h += `<div class="section"><div class="section-label">Your submission</div>
          <div class="more-row">Nothing submitted yet</div></div>`;
  }

  // ── Detail (visible only when expanded) ──
  h += `<div id="detail">`;
  if (files.length > 2) {
    h += `<div class="section"><div class="section-label">All attachments</div>
          <div class="files">${files.slice(2).map(fileRow).join("")}</div></div>`;
  }
  if (submitted && submitted.length > 1) {
    h += `<div class="section"><div class="section-label">All submissions</div>
          <div class="files">${submitted.slice(1).map((f) => fileRow({ name: f.name, meta: f.uploaded || "", url: f.url })).join("")}</div></div>`;
  }
  if (task.discussions && task.discussions.length) {
    h += `<div class="section"><div class="section-label">Discussion</div>` +
         task.discussions.map((d) =>
           `<div class="disc"><div class="disc-author">${esc(d.author)}</div>
            <div class="disc-body">${esc(d.body)}</div>
            ${d.posted ? `<div class="disc-date">${esc(d.posted)}</div>` : ""}</div>`).join("") +
         `</div>`;
  }
  if (task.unit && task.unit.name) {
    h += `<div class="unit-row">Unit: <b>${esc(task.unit.name)}</b>${task.unit.duration ? ` · ${esc(task.unit.duration)}` : ""}</div>`;
  }
  h += `</div>`;

  // Actions — max two, per Apps SDK inline-card rules
  const hasDetail = task.description || task.teacher_comment || files.length > 2 ||
    (submitted && submitted.length > 1) || (task.discussions && task.discussions.length) || task.unit;
  h += `<div class="actions">`;
  if (hasDetail) h += `<button class="btn" id="toggle">Show details</button>`;
  if (task.url) h += `<button class="btn primary" id="open">${LINK_ICON} Open in ManageBac</button>`;
  h += `</div>`;

  card.classList.remove("expanded");
  card.innerHTML = h;

  // ── Wire actions ──
  document.getElementById("open")?.addEventListener("click", () => {
    // ChatGPT extension first (skips sandbox popup restrictions), plain fallback otherwise
    if (window.openai?.openExternal) window.openai.openExternal({ href: task.url });
    else window.open(task.url, "_blank", "noopener");
  });
  const toggle = document.getElementById("toggle");
  toggle?.addEventListener("click", () => {
    const expanded = card.classList.toggle("expanded");
    document.getElementById("desc")?.classList.toggle("clamped", !expanded);
    document.getElementById("comment")?.classList.toggle("clamped", !expanded);
    toggle.textContent = expanded ? "Hide details" : "Show details";
    try { window.openai?.setWidgetState?.({ expanded }); } catch (_) {}
    reportHeight();
  });
  document.getElementById("more-files")?.addEventListener("click", () => toggle?.click());

  // Hide the toggle when expanding would reveal nothing: no hidden detail
  // sections AND neither clamped block actually overflows its clamp.
  if (toggle) {
    const hiddenDetail = document.getElementById("detail").children.length > 0;
    const clampedOverflows = ["desc", "comment"].some((id) => {
      const el = document.getElementById(id);
      return el && el.scrollHeight > el.clientHeight + 1;
    });
    if (!hiddenDetail && !clampedOverflows) toggle.remove();
  }

  // Restore expanded state across re-renders
  try { if (window.openai?.widgetState?.expanded) document.getElementById("toggle")?.click(); } catch (_) {}

  reportHeight();
}

// ── Data intake: toolOutput now, notifications later ─────────────────────
function hasData(d) { return d && typeof d === "object" && (d.title || d.url); }

applyTheme();
if (hasData(window.openai?.toolOutput)) render(window.openai.toolOutput);

window.addEventListener("message", (ev) => {
  if (ev.source !== window.parent) return;
  const msg = ev.data;
  if (msg?.method === "ui/notifications/tool-result") {
    const d = msg.params?.structuredContent;
    if (hasData(d)) render(d);
  }
}, { passive: true });

window.addEventListener("openai:set_globals", (ev) => {
  applyTheme();
  const d = ev.detail?.globals?.toolOutput ?? window.openai?.toolOutput;
  if (hasData(d) && d !== currentTask) render(d);
}, { passive: true });

// Console/harness hook
window.renderTaskCard = render;
</script>
</body>
</html>
